# Builds this repo's production image and pushes it to GHCR.
#
# This is the `github` deploy channel. `hc-admin-ci/deploy.sh --channel github` deploys exactly
# these images, by hand, with the same compose.yml and the same ./start — so a CI-built image and a
# hand-built one are deployed by the same operation, and only their provenance differs.
#
# --- Tags ----------------------------------------------------------------------------------------
#
# ${{ github.sha }} — the FULL 40-character SHA — plus `latest` as a convenience for humans.
#
# hc-admin is three separate repositories (hc-admin-gateway, hc-admin-service, hc-admin-dashboard)
# with three independent HEADs, so there is no shared commit that could name the set. Each repo
# therefore tags only its own image with its own SHA, and the deployment carries three tag values:
# GATEWAY_TAG, API_TAG and WEB_TAG. deploy.sh resolves them from each checkout's HEAD.
#
# Do not "simplify" this to a single shared tag. The images would collide: a change confined to one
# repo would republish different content under a tag that already exists on the other two.
#
# --- The Dockerfile is not in this repo, and neither is the nginx config ---------------------------
#
# Both live in the deployment repo, so that these three application repos need no deployment-specific
# files of their own. This repo DOES ship a Dockerfile.prod, and it is deliberately not used: it runs
# `npm run webapp:build` (a development build) and sets a SERVER_API_URL that webpack.custom.js
# overrides anyway. See docker/web.Dockerfile in the deployment repo for the full account.
#
# The nginx config is why this build needs a named extra context. web.Dockerfile does
# `COPY --from=deploycfg web-nginx.conf ...`, which is a second build context supplied by name —
# the equivalent of build.sh's `--build-context deploycfg=./docker`. Without it the image would
# serve static files but proxy nothing, and every /api call from the SPA would 404.
#
# PREREQUISITE: an `HC_ADMIN_CI_TOKEN` secret on this repo, holding a token that can read
# kojoampia/hc-admin-ci. That repo is private, and a workflow's default GITHUB_TOKEN is scoped to
# the repo it runs in — it can read a public sibling and nothing else. A fine-grained PAT limited to
# hc-admin-ci with Contents: Read-only is enough. Set `vars.DEPLOY_REPO` if the repo is ever renamed.
#
# --- No quality gate here ---------------------------------------------------------------------------
#
# This workflow builds and pushes; it does not run `npm test` or `npm run lint`. Add a separate
# ci.yml if you want that gate — do not fold it into this file, or a failing test would leave the
# registry without an image for a commit that is already on main.
name: Release

on:
  push:
    branches: [main]
  # Re-running a release for an already-merged commit should not require an empty push.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never interrupt a push mid-flight

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hc-admin-web

jobs:
  build-image:
    name: Build and push the dashboard image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required by upload-sarif.
      security-events: write
    steps:
      # Into a subdirectory rather than the workspace root, and it matters more here than in the
      # sibling repos: web.Dockerfile does `COPY . .`, so a deployment checkout at the workspace
      # root would be copied into the build stage along with the application.
      - name: Check out the dashboard
        uses: actions/checkout@v4
        with:
          path: app

      - name: Check out the deployment repo (for docker/web.Dockerfile and the nginx config)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO || format('{0}/hc-admin-ci', github.repository_owner) }}
          # HC_ADMIN_CI_TOKEN is required — see the header. The fallback to github.token is not a
          # working configuration for a private deployment repo; it exists so a missing secret fails
          # HERE, on a checkout that plainly names the repo it could not read, rather than further
          # down on a Dockerfile that mysteriously does not exist.
          token: ${{ secrets.HC_ADMIN_CI_TOKEN || github.token }}
          path: deploycfg

      # GHCR rejects an upper-case path component, and github.repository_owner preserves whatever
      # case the account was registered with — so it is folded here rather than assumed.
      - name: Resolve the image path
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PATH=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: app
          file: deploycfg/docker/web.Dockerfile
          # The named second context the Dockerfile's `COPY --from=deploycfg` reads. This is the
          # workflow's equivalent of build.sh's `--build-context deploycfg=./docker`.
          build-contexts: |
            deploycfg=deploycfg/docker
          push: true
          # The SHA is what deploy.sh pins; `latest` is a convenience for humans and is never what
          # production resolves to.
          tags: |
            ${{ env.IMAGE_PATH }}:${{ github.sha }}
            ${{ env.IMAGE_PATH }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # Scans the image that was just pushed, not a rebuild of it — the digest above is what runs in
      # production, and a scan of anything else is a scan of something else.
      #
      # Reports, does not block: this pipeline deliberately keeps the registry populated even when a
      # check fails (see the header), and a base-image CVE with no upstream fix would otherwise stop
      # deployment of an unrelated application change. Results land in the Security tab, and the
      # exit-code stays 0 by design.
      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_PATH }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload the scan to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Report the deploy command
        run: |
          echo "### Deploy this build" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "WEB_TAG=${{ github.sha }} ./deploy.sh --channel github" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Run from a checkout of hc-admin-ci. Omit WEB_TAG to deploy whatever the three" >> "$GITHUB_STEP_SUMMARY"
          echo "sibling checkouts are on." >> "$GITHUB_STEP_SUMMARY"
