@if (filters.hasAnyFilterSet()) {
  <div class="rounded-2xl border border-slate-200 bg-white/90 px-4 py-3 shadow-sm">
    <div class="mb-3 flex items-start justify-between gap-3">
      <span class="text-sm font-semibold text-slate-700" hpdTranslate="entity.filters.set">Following filters are set</span>
      <button
        type="button"
        mat-icon-button
        class="!h-8 !w-8 !text-slate-500"
        (click)="clearAllFilters()"
        title="{{ 'entity.filters.clearAll' | translate }}"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <ul class="m-0 flex list-none flex-wrap gap-2 p-0">
      @for (filterOption of filters.filterOptions; track filterOption.name) {
        @for (value of filterOption.values; track value) {
          <li class="inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-sm text-slate-700">
            <span class="font-semibold">{{ filterOption.name }}:</span>
            <span>{{ value }}</span>
            <button
              type="button"
              mat-icon-button
              class="!h-6 !w-6 !text-slate-500"
              (click)="clearFilter(filterOption.name, value)"
              title="{{ 'entity.filters.clear' | translate }}"
            >
              <mat-icon class="!h-4 !w-4 !text-base">close</mat-icon>
            </button>
          </li>
        }
      }
    </ul>
  </div>
}
