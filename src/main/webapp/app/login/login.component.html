<div class="flex justify-center px-4 py-8">
  <mat-card class="w-full max-w-xl !rounded-[2rem] !border !border-slate-200 !bg-white/95 !p-8 !shadow-sm">
    <div class="space-y-6">
      <div class="space-y-2">
        <h1 class="text-3xl font-semibold text-slate-900" hpdTranslate="login.title" data-cy="loginTitle">Sign in</h1>
        <p class="text-sm text-slate-500">Access the admin workspace with your Health Connect credentials.</p>
      </div>

      @if (authenticationError) {
        <div
          class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900"
          hpdTranslate="login.messages.error.authentication"
          data-cy="loginError"
        >
          <strong>Failed to sign in!</strong> Please check your credentials and try again.
        </div>
      }

      <form class="space-y-4" role="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label hpdTranslate="global.form.username.label">Username</mat-label>
          <input
            matInput
            type="text"
            name="username"
            id="username"
            placeholder="{{ 'global.form.username.placeholder' | translate }}"
            formControlName="username"
            #username
            data-cy="username"
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-full">
          <mat-label hpdTranslate="login.form.password">Password</mat-label>
          <input
            matInput
            type="password"
            name="password"
            id="password"
            placeholder="{{ 'login.form.password.placeholder' | translate }}"
            formControlName="password"
            data-cy="password"
          />
        </mat-form-field>

        <mat-checkbox formControlName="rememberMe" id="rememberMe">
          <span hpdTranslate="login.form.rememberme">Remember me</span>
        </mat-checkbox>

        <div class="flex flex-wrap items-center gap-3">
          <button mat-flat-button color="primary" type="submit" data-cy="submit">
            <span hpdTranslate="login.form.button">Sign in</span>
          </button>
          <a mat-button routerLink="/account/reset/request" hpdTranslate="login.password.forgot" data-cy="forgetYourPasswordSelector">
            Did you forget your password?
          </a>
        </div>
      </form>
    </div>
  </mat-card>
</div>
