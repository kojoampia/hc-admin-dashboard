<div class="flex justify-center px-4 py-8">
  <mat-card class="w-full max-w-2xl !rounded-[2rem] !border !border-slate-200 !bg-white/95 !p-8 !shadow-sm">
    <div class="space-y-4">
      <h1 class="text-3xl font-semibold text-slate-900" hpdTranslate="activate.title">Activation</h1>
      @if (success) {
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-900">
          <span hpdTranslate="activate.messages.success"><strong>Your user account has been activated.</strong> Please </span>
          <a
            class="font-semibold text-emerald-700 hover:text-emerald-600"
            routerLink="/login"
            hpdTranslate="global.messages.info.authenticated.link"
          >
            sign in
          </a>
          .
        </div>
      }
      @if (error) {
        <div class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-900" hpdTranslate="activate.messages.error">
          <strong>Your user could not be activated.</strong> Please use the registration form to sign up.
        </div>
      }
    </div>
  </mat-card>
</div>
