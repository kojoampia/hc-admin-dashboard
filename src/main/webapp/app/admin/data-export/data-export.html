<article class="flex h-full flex-col gap-5 rounded-hpd-lg border border-hpd-border bg-white p-5 shadow-hpd-sm">
  <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
    <div class="space-y-1">
      <p class="text-xs font-semibold uppercase tracking-[0.25em] text-hpd-muted" hpdTranslate="adminDashboard.dataExport.title"></p>
      <h2 class="text-xl font-semibold tracking-tight text-hpd-primary-dark" hpdTranslate="adminDashboard.dataExport.subtitle"></h2>
      <p class="max-w-3xl text-sm leading-6 text-hpd-muted" hpdTranslate="adminDashboard.dataExport.description"></p>
      @if (lastExportedAt) {
      <p class="text-xs font-medium text-hpd-muted">Last exported {{ lastExportedAt | date: 'medium' }}</p>
      }
    </div>

    <div class="flex flex-wrap gap-3">
      <button mat-flat-button color="primary" type="button" class="!rounded-full" [disabled]="isExporting" (click)="exportSnapshotJson()">
        <mat-icon>download</mat-icon>
        <span hpdTranslate="adminDashboard.dataExport.exportJson">Export JSON</span>
      </button>
      <button mat-stroked-button type="button" class="!rounded-full" [disabled]="isExporting" (click)="exportSummaryCsv()">
        <mat-icon>table_view</mat-icon>
        <span hpdTranslate="adminDashboard.dataExport.exportCsv">Export CSV</span>
      </button>
    </div>
  </div>

  @if (errorMessage) {
  <p class="rounded-hpd border border-hpd-danger/30 bg-hpd-danger-tint px-4 py-3 text-sm text-hpd-danger">{{ errorMessage }}</p>
  }

  <div class="grid gap-3 md:grid-cols-3">
    <div class="rounded-hpd bg-hpd-cream p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-muted" hpdTranslate="adminDashboard.dataExport.sources"></p>
      <p class="mt-2 text-sm font-semibold text-hpd-primary-dark" hpdTranslate="adminDashboard.dataExport.sourcesValue"></p>
    </div>
    <div class="rounded-hpd bg-hpd-primary/10 p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-primary" hpdTranslate="adminDashboard.dataExport.formats"></p>
      <p class="mt-2 text-sm font-semibold text-hpd-primary-deep" hpdTranslate="adminDashboard.dataExport.formatsValue"></p>
    </div>
    <div class="rounded-hpd bg-hpd-warning-tint p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-warning" hpdTranslate="adminDashboard.dataExport.access"></p>
      <p class="mt-2 text-sm font-semibold text-hpd-warning" hpdTranslate="adminDashboard.dataExport.accessValue"></p>
    </div>
  </div>
</article>
