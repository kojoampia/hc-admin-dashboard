@if (health) {
  <div class="space-y-6 p-2">
    <div class="flex items-start justify-between gap-4 border-b border-hpd-border pb-4">
      <div class="space-y-1">
        <h2 class="text-xl font-semibold text-hpd-primary-dark" id="showHealthLabel">{{ 'health.indicator.' + health.key | translate }}</h2>
        <p class="text-sm text-hpd-muted" hpdTranslate="health.details.properties">Properties</p>
      </div>

      <button mat-icon-button type="button" aria-label="Close" (click)="dismiss()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="overflow-x-auto rounded-hpd border border-hpd-border">
      <table class="min-w-full divide-y divide-hpd-border bg-white" aria-describedby="showHealthLabel">
        <thead class="bg-hpd-cream text-left text-xs font-semibold uppercase tracking-wide text-hpd-muted">
          <tr>
            <th scope="col" class="px-4 py-3 text-start" hpdTranslate="health.details.name">Name</th>
            <th scope="col" class="px-4 py-3 text-start" hpdTranslate="health.details.value">Value</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-hpd-border text-sm text-hpd-muted">
          @for (healthDetail of health.value.details! | keyvalue; track healthDetail.key) {
            <tr>
              <td class="px-4 py-4 text-start font-medium text-hpd-primary-dark">{{ healthDetail.key }}</td>
              <td class="px-4 py-4 text-start">{{ readableValue(healthDetail.value) }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex justify-end">
      <button mat-button type="button" (click)="dismiss()">Done</button>
    </div>
  </div>
}
