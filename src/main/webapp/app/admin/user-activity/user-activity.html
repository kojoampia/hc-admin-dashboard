<article class="flex h-full flex-col gap-5 rounded-hpd-lg border border-hpd-border bg-white p-5 shadow-hpd-sm">
  <div class="flex items-start justify-between gap-4">
    <div class="space-y-1">
      <p class="text-xs font-semibold uppercase tracking-[0.25em] text-hpd-muted" hpdTranslate="adminDashboard.userActivity.title"></p>
      <h2 class="text-xl font-semibold tracking-tight text-hpd-primary-dark" hpdTranslate="adminDashboard.userActivity.subtitle"></h2>
      <p class="text-sm leading-6 text-hpd-muted" hpdTranslate="adminDashboard.userActivity.description"></p>
    </div>

    <a mat-stroked-button routerLink="/admin/user-management" class="!rounded-full">
      <mat-icon>groups</mat-icon>
      <span hpdTranslate="adminDashboard.userActivity.manageUsers">Manage users</span>
    </a>
  </div>

  @if (isLoading) {
  <p class="rounded-hpd bg-hpd-cream px-4 py-3 text-sm text-hpd-muted" hpdTranslate="adminDashboard.userActivity.loading"></p>
  } @else if (errorMessage) {
  <p class="rounded-hpd border border-hpd-danger/30 bg-hpd-danger-tint px-4 py-3 text-sm text-hpd-danger">{{ errorMessage }}</p>
  } @else {
  <div class="grid gap-3 sm:grid-cols-2">
    <div class="rounded-hpd bg-hpd-cream p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-muted" hpdTranslate="adminDashboard.userActivity.totalUsers"></p>
      <p class="mt-2 text-3xl font-semibold text-hpd-primary-dark">{{ totalUsers }}</p>
    </div>
    <div class="rounded-hpd bg-hpd-success-tint p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-success" hpdTranslate="adminDashboard.userActivity.activated"></p>
      <p class="mt-2 text-3xl font-semibold text-hpd-success">{{ activeUsers }}</p>
    </div>
    <div class="rounded-hpd bg-hpd-warning-tint p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-warning" hpdTranslate="adminDashboard.userActivity.administrators"></p>
      <p class="mt-2 text-3xl font-semibold text-hpd-warning">{{ adminUsers }}</p>
    </div>
    <div class="rounded-hpd bg-hpd-primary/10 p-4">
      <p class="text-xs font-medium uppercase tracking-wide text-hpd-primary" hpdTranslate="adminDashboard.userActivity.newIn30Days"></p>
      <p class="mt-2 text-3xl font-semibold text-hpd-primary-deep">{{ recentUsers }}</p>
    </div>
  </div>

  <div class="rounded-hpd-lg border border-hpd-border bg-hpd-cream p-3">
    <ngx-charts-pie-chart [results]="userStatusData" [labels]="true" [legend]="true" [explodeSlices]="true" />
  </div>
  }
</article>
