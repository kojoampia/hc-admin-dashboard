<div class="space-y-4" *ngIf="badges && badges.length > 0">
  <div class="flex items-center justify-between gap-4" *ngIf="title">
    <h2 class="text-2xl font-semibold text-slate-900">{{ title }}</h2>
    <button
      type="button"
      class="inline-flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 transition hover:border-slate-300 hover:text-slate-700"
      aria-label="Close"
      (click)="closeBadge()"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="grid gap-4" [class.md:grid-cols-2]="medium || large" [class.xl:grid-cols-3]="large">
    <div
      *ngFor="let badge of badges; let i = index"
      class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm transition hover:border-slate-300 hover:shadow-md"
    >
      <div class="space-y-4 text-center">
        <div>
          <h3 *ngIf="small" class="text-xl font-semibold text-slate-900">{{ badge.name }}</h3>
          <h2 *ngIf="medium" class="text-2xl font-semibold text-slate-900">{{ badge.name }}</h2>
          <h1 *ngIf="large" class="text-3xl font-semibold tracking-tight text-slate-900">{{ badge.name }}</h1>
        </div>

        <button
          type="button"
          class="badge-action inline-flex min-w-32 items-center justify-center rounded-full bg-slate-900 px-6 py-3 font-semibold text-white transition hover:bg-slate-700"
          (click)="toggleSelected(badge)"
          [ngClass]="{ selected: badge.selected && showSelected, 'text-sm': small, 'text-base': medium, 'text-xl': large }"
        >
          &euro;{{ badge.value }}
        </button>

        <p class="text-sm leading-6 text-slate-600" *ngIf="badge.description">
          {{ badge.description }}
        </p>
      </div>
    </div>
  </div>
</div>
