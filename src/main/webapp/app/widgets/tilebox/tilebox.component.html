<div class="space-y-4" *ngIf="tiles && tiles.length > 0">
  <h2 *ngIf="title" class="text-2xl font-semibold text-slate-900">{{ title }}</h2>

  <ngu-carousel [inputs]="config" [dataSource]="tiles">
    <ngu-tile NguCarouselItem *nguCarouselDef="let tile; let i = index">
      <div *ngIf="tile" class="tile-card overflow-hidden rounded-3xl border border-slate-200 bg-white shadow-sm">
        <div class="aspect-[4/3] overflow-hidden bg-slate-100">
          <img [src]="tile.url" alt="insurance image" class="h-full w-full object-cover" />
        </div>

        <div class="tile-overlay space-y-4">
          <div class="min-h-20">
            <h3 class="text-center text-lg font-semibold text-slate-900">{{ tile.title }}</h3>
          </div>

          <p class="rounded-2xl bg-cyan-900 px-3 py-2 text-left text-sm font-medium text-white">
            <em>
              <span [hpdTranslate]="'adminDashboardApp.InsuranceCategory.' + tile.category">
                {{ tile.category }}
              </span>
            </em>
          </p>

          <div class="flex justify-end">
            <button
              type="button"
              class="inline-flex items-center rounded-full border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slate-400 hover:bg-slate-50"
              (click)="toggleSelected(tile)"
            >
              <span>See details...</span>
            </button>
          </div>
        </div>
      </div>
    </ngu-tile>

    <button NguCarouselPrev type="button" class="left-arrow bg-slate-900 text-white" aria-label="Previous slide">&lt;</button>
    <button NguCarouselNext type="button" class="right-arrow bg-slate-900 text-white" aria-label="Next slide">&gt;</button>
  </ngu-carousel>
</div>
