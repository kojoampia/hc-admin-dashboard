<div *ngIf="faq" class="rounded-2xl border border-slate-200 bg-white/80">
  <button
    type="button"
    class="flex w-full items-center justify-between gap-3 rounded-2xl px-3 py-2 text-left text-sm font-medium text-slate-700 transition hover:bg-slate-50"
    (click)="togglePanel()"
  >
    <span>{{ faq.question }}</span>
    <mat-icon class="shrink-0 text-lg text-slate-500">{{ isPanelOpen ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
  <ng-container *ngIf="isPanelOpen">
    <div class="border-t border-slate-100 px-3 py-2 text-sm leading-6 text-slate-600">{{ faq.answer }}</div>
  </ng-container>
</div>
