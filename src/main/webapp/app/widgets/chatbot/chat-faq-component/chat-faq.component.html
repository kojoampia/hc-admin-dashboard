<div class="w-full">
  <div class="w-full" *ngIf="!selectedCategory">
    <p class="m-0 text-right">
      <span class="header">I have a question on...</span>
    </p>
    <div class="mt-2 flex flex-wrap gap-2">
      <button type="button" class="pill" *ngFor="let category of faqCategoryList" (click)="selectCategory(category)">
        <span>{{ category.label }}</span>
        <span class="badge">{{ getFaqCount(category) }}</span>
      </button>
    </div>
  </div>
  <div class="faq-list space-y-2" *ngIf="selectedCategory">
    <hpd-chat-accordion [faq]="faq" *ngFor="let faq of getSelectedCategoryFaqs()"></hpd-chat-accordion>

    <div class="flex justify-center pt-1">
      <button type="button" mat-stroked-button class="!rounded-full" (click)="onBack()">Back</button>
    </div>
  </div>
</div>
