<div class="chat-panel" *ngIf="isToggleChat">
  <div class="chat-header">
    <div>
      <p class="m-0 text-sm font-semibold text-white">Customer Service Chat</p>
      <p class="m-0 text-xs text-white/75">We are here to help.</p>
    </div>
    <button type="button" mat-icon-button class="chat-close-button" (click)="toggleChat()" aria-label="Close chat">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="chat-body" #chatScreen>
    <form
      name="form"
      role="registerForm"
      id="registerForm"
      (ngSubmit)="register()"
      [formGroup]="registerForm"
      *ngIf="!success"
      class="space-y-4"
    >
      <div class="space-y-1">
        <p class="m-0 text-sm font-medium text-slate-700">Hello, please tell us who you are.</p>
        <p class="m-0 rounded-2xl bg-rose-50 px-3 py-2 text-xs font-medium text-rose-600" *ngIf="registrationInvalid">
          Registration input invalid. Please check your entry.
        </p>
      </div>
      <div class="space-y-3">
        <div class="space-y-1">
          <label class="text-xs font-semibold uppercase tracking-wide text-slate-500" for="field_firstName">First Name</label>
          <input
            type="text"
            class="w-full rounded-2xl border-0 bg-slate-100 px-4 py-3 text-sm text-slate-700 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-slate-300"
            name="firstName"
            id="field_firstName"
            formControlName="firstName"
            #firstName
          />
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold uppercase tracking-wide text-slate-500" for="field_lastName">Last Name</label>
          <input
            type="text"
            class="w-full rounded-2xl border-0 bg-slate-100 px-4 py-3 text-sm text-slate-700 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-slate-300"
            name="lastName"
            id="field_lastName"
            formControlName="lastName"
            #lastName
          />
        </div>
        <div class="space-y-1">
          <label class="text-xs font-semibold uppercase tracking-wide text-slate-500" for="field_email">Email</label>
          <input
            type="text"
            class="w-full rounded-2xl border-0 bg-slate-100 px-4 py-3 text-sm text-slate-700 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-slate-300"
            name="email"
            id="field_email"
            formControlName="email"
            #email
          />
        </div>
      </div>
      <div class="flex justify-end">
        <button type="submit" mat-flat-button class="!rounded-full !bg-slate-900 !px-4 !py-2 !text-white">Submit</button>
      </div>
    </form>

    <div class="chat-box space-y-3" *ngIf="success">
      <div class="space-y-3" *ngFor="let item of messages">
        <div [ngClass]="{ 'right-message': item.sender === client?.email, 'left-message': item.sender !== client?.email }">
          <div [ngClass]="{ customer: item.sender === client?.email, alice: item.sender !== client?.email }">
            <span class="block w-full text-sm">
              {{ item.content }}
            </span>
          </div>
          <p
            class="mt-1 text-xs italic text-slate-400"
            [class.text-right]="item.sender === client?.email"
            [class.text-left]="item.sender !== client?.email"
          >
            {{ item.createdDate | formatMediumDate }}
          </p>
        </div>
        <hpd-chat-faq class="block w-full" *ngIf="item.sender !== client?.email"></hpd-chat-faq>
      </div>
    </div>
  </div>

  <div class="chat-footer">
    <form action="#" class="space-y-3" *ngIf="success" novalidate name="messageForm" role="form" (ngSubmit)="send()" #messageForm="ngForm">
      <textarea
        [(ngModel)]="message"
        name="message"
        class="min-h-24 w-full resize-none rounded-2xl border-0 bg-slate-100 px-4 py-3 text-sm text-slate-700 outline-none ring-1 ring-transparent transition focus:bg-white focus:ring-2 focus:ring-slate-300"
        (keyup.enter)="send()"
      ></textarea>
      <div class="flex justify-end">
        <button type="button" mat-flat-button class="!rounded-full !bg-slate-900 !px-4 !py-2 !text-white" (click)="send()">Send</button>
      </div>
    </form>
  </div>
</div>

<div *ngIf="!isToggleChat">
  <button type="button" class="chat-launcher" (click)="toggleChat()">
    <mat-icon>chat</mat-icon>
    <span>Hello</span>
  </button>
</div>
