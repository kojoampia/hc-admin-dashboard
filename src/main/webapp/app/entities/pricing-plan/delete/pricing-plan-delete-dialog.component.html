@if (pricingPlan) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(pricingPlan.id!)" class="space-y-6">
    <div class="flex items-start justify-between gap-4 border-b border-hpd-border pb-4">
      <div class="space-y-1">
        <h2 data-cy="pricingPlanDeleteDialogHeading" hpdTranslate="entity.delete.title" class="text-lg font-semibold text-hpd-primary-dark">
          Confirm delete operation
        </h2>
        <p class="text-sm text-hpd-muted">This action cannot be undone.</p>
      </div>

      <button mat-icon-button type="button" aria-label="Close dialog" (click)="cancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="space-y-4">
      <hpd-alert-error />
      <p
        id="hpd-delete-pricingPlan-heading"
        hpdTranslate="adminDashboardApp.hcAdminServicePricingPlan.delete.question"
        [translateValues]="{ id: pricingPlan.id }"
        class="text-sm leading-6 text-hpd-muted"
      >
        Are you sure you want to delete Pricing Plan {{ pricingPlan.id }}?
      </p>
    </div>

    <div class="flex justify-end gap-3 border-t border-hpd-border pt-4">
      <button mat-button type="button" (click)="cancel()">
        <mat-icon>close</mat-icon>
        <span hpdTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button
        id="hpd-confirm-delete-pricingPlan"
        data-cy="entityConfirmDeleteButton"
        type="submit"
        mat-flat-button
        color="warn"
        type="submit"
      >
        <mat-icon>delete</mat-icon>
        <span hpdTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
