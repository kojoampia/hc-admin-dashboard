<div class="mx-auto max-w-4xl">
  <form
    name="editForm"
    novalidate
    (ngSubmit)="save()"
    [formGroup]="editForm"
    class="space-y-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div class="space-y-2">
      <h2
        id="hpd-dashboard-heading"
        data-cy="DashboardCreateUpdateHeading"
        class="text-2xl font-semibold text-slate-900"
        hpdTranslate="adminDashboardApp.hcAdminServiceDashboard.home.createOrEditLabel"
      >
        Create or edit a Dashboard
      </h2>
      <p class="text-sm text-slate-500">Update dashboard naming, summary text, and configured elements.</p>
    </div>

    <hpd-alert-error />

    <div class="grid gap-4 md:grid-cols-2">
      @if (editForm.controls.id.value !== null) {
        <mat-form-field class="md:col-span-2">
          <mat-label hpdTranslate="adminDashboardApp.hcAdminServiceDashboard.id">ID</mat-label>
          <input matInput type="text" name="id" id="field_id" data-cy="id" formControlName="id" readonly />
        </mat-form-field>
      }

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.hcAdminServiceDashboard.name">Name</mat-label>
        <input matInput type="text" name="name" id="field_name" data-cy="name" formControlName="name" />
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.hcAdminServiceDashboard.elements">Elements</mat-label>
        <input matInput type="text" name="elements" id="field_elements" data-cy="elements" formControlName="elements" />
      </mat-form-field>

      <mat-form-field class="md:col-span-2">
        <mat-label hpdTranslate="adminDashboardApp.hcAdminServiceDashboard.description">Description</mat-label>
        <textarea
          matInput
          name="description"
          id="field_description"
          data-cy="description"
          formControlName="description"
          rows="3"
        ></textarea>
      </mat-form-field>
    </div>

    <div class="flex flex-wrap justify-end gap-3">
      <button
        type="button"
        id="cancel-save"
        data-cy="entityCreateCancelButton"
        mat-button
        class="!rounded-full !px-4"
        (click)="previousState()"
      >
        <mat-icon>close</mat-icon>
        <span hpdTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button
        type="submit"
        id="save-entity"
        data-cy="entityCreateSaveButton"
        [disabled]="editForm.invalid || isSaving"
        mat-flat-button
        class="!rounded-full !bg-slate-900 !px-4 !text-white"
      >
        <mat-icon>save</mat-icon>
        <span hpdTranslate="entity.action.save">Save</span>
      </button>
    </div>
  </form>
</div>
