@if (contact) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(contact.id!)" class="space-y-6">
    <div class="flex items-start justify-between gap-4 border-b border-slate-200 pb-4">
      <div class="space-y-1">
        <h2 data-cy="contactDeleteDialogHeading" hpdTranslate="entity.delete.title" class="text-lg font-semibold text-slate-900">
          Confirm delete operation
        </h2>
        <p class="text-sm text-slate-500">This action cannot be undone.</p>
      </div>

      <button mat-icon-button type="button" aria-label="Close dialog" (click)="cancel()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="space-y-4">
      <hpd-alert-error />
      <p
        id="hpd-delete-contact-heading"
        hpdTranslate="adminDashboardApp.contact.delete.question"
        [translateValues]="{ id: contact.id }"
        class="text-sm leading-6 text-slate-700"
      >
        Are you sure you want to delete Contact {{ contact.id }}?
      </p>
    </div>

    <div class="flex justify-end gap-3 border-t border-slate-200 pt-4">
      <button mat-button type="button" (click)="cancel()">
        <mat-icon>close</mat-icon>
        <span hpdTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button id="hpd-confirm-delete-contact" data-cy="entityConfirmDeleteButton" mat-flat-button color="warn" type="submit">
        <mat-icon>delete</mat-icon>
        <span hpdTranslate="entity.action.delete">Delete</span>
      </button>
    </div>
  </form>
}
