<div class="mx-auto max-w-4xl">
  @if (contact(); as contactRef) {
    <div class="space-y-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
      <div class="space-y-2">
        <h2 data-cy="contactDetailsHeading" class="text-2xl font-semibold text-slate-900">
          <span hpdTranslate="adminDashboardApp.contact.detail.title">Contact</span>
        </h2>
        <p class="text-sm text-slate-500">Inspect the contact channels and person link for this record.</p>
      </div>

      <hpd-alert-error />
      <hpd-alert />

      <div class="grid gap-4 sm:grid-cols-2">
        <div class="rounded-2xl bg-slate-50 p-4">
          <p class="text-xs font-semibold uppercase text-slate-500" hpdTranslate="global.field.id">ID</p>
          <p class="mt-1 text-sm text-slate-900">{{ contactRef.id }}</p>
        </div>
        <div class="rounded-2xl bg-slate-50 p-4">
          <p class="text-xs font-semibold uppercase text-slate-500" hpdTranslate="adminDashboardApp.contact.personId">Person Id</p>
          <p class="mt-1 text-sm text-slate-900">{{ contactRef.personId }}</p>
        </div>
        <div class="rounded-2xl bg-slate-50 p-4">
          <p class="text-xs font-semibold uppercase text-slate-500" hpdTranslate="adminDashboardApp.contact.email">Email</p>
          <p class="mt-1 text-sm text-slate-900">{{ contactRef.email }}</p>
        </div>
        <div class="rounded-2xl bg-slate-50 p-4">
          <p class="text-xs font-semibold uppercase text-slate-500" hpdTranslate="adminDashboardApp.contact.phoneNumber">Phone Number</p>
          <p class="mt-1 text-sm text-slate-900">{{ contactRef.phoneNumber }}</p>
        </div>
        <div class="rounded-2xl bg-slate-50 p-4 sm:col-span-2">
          <p class="text-xs font-semibold uppercase text-slate-500" hpdTranslate="adminDashboardApp.contact.countryCode">Country Code</p>
          <p class="mt-1 text-sm text-slate-900">{{ contactRef.countryCode }}</p>
        </div>
      </div>

      <div class="flex flex-wrap justify-end gap-3">
        <button type="button" mat-button class="!rounded-full !px-4" (click)="previousState()" data-cy="entityDetailsBackButton">
          <mat-icon>arrow_back</mat-icon>
          <span hpdTranslate="entity.action.back">Back</span>
        </button>
        <a
          type="button"
          [routerLink]="['/contact', contactRef.id, 'edit']"
          mat-flat-button
          class="!rounded-full !bg-slate-900 !px-4 !text-white"
        >
          <mat-icon>edit</mat-icon>
          <span hpdTranslate="entity.action.edit">Edit</span>
        </a>
      </div>
    </div>
  }
</div>
