<div class="mx-auto max-w-5xl">
  <form
    name="editForm"
    novalidate
    (ngSubmit)="save()"
    [formGroup]="editForm"
    class="space-y-6 rounded-3xl border border-slate-200 bg-white p-6 shadow-sm"
  >
    <div class="space-y-2">
      <h2
        id="hpd-audit-log-heading"
        data-cy="AuditLogCreateUpdateHeading"
        class="text-2xl font-semibold text-slate-900"
        hpdTranslate="adminDashboardApp.auditLog.home.createOrEditLabel"
      >
        Create or edit a Audit Log
      </h2>
      <p class="text-sm text-slate-500">Update audit actors, metadata, and timestamp fields.</p>
    </div>

    <hpd-alert-error />

    <div class="grid gap-4 md:grid-cols-2">
      @if (editForm.controls.id.value !== null) {
        <mat-form-field class="md:col-span-2">
          <mat-label hpdTranslate="adminDashboardApp.auditLog.id">ID</mat-label>
          <input matInput type="text" name="id" id="field_id" data-cy="id" formControlName="id" readonly />
        </mat-form-field>
      }

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.actionType">Action Type</mat-label>
        <input matInput type="text" name="actionType" id="field_actionType" data-cy="actionType" formControlName="actionType" />
        <mat-error *ngIf="editForm.get('actionType')?.errors?.required" hpdTranslate="entity.validation.required">
          This field is required.
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.userId">User Id</mat-label>
        <input matInput type="text" name="userId" id="field_userId" data-cy="userId" formControlName="userId" />
        <mat-error *ngIf="editForm.get('userId')?.errors?.required" hpdTranslate="entity.validation.required"
          >This field is required.</mat-error
        >
      </mat-form-field>

      <mat-form-field class="md:col-span-2">
        <mat-label hpdTranslate="adminDashboardApp.auditLog.metadata">Metadata</mat-label>
        <textarea matInput name="metadata" id="field_metadata" data-cy="metadata" formControlName="metadata" rows="3"></textarea>
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.createdBy">Created By</mat-label>
        <input matInput type="text" name="createdBy" id="field_createdBy" data-cy="createdBy" formControlName="createdBy" />
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.createdDate">Created Date</mat-label>
        <input
          matInput
          id="field_createdDate"
          data-cy="createdDate"
          type="datetime-local"
          name="createdDate"
          formControlName="createdDate"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.modifiedBy">Modified By</mat-label>
        <input matInput type="text" name="modifiedBy" id="field_modifiedBy" data-cy="modifiedBy" formControlName="modifiedBy" />
      </mat-form-field>

      <mat-form-field>
        <mat-label hpdTranslate="adminDashboardApp.auditLog.modifiedDate">Modified Date</mat-label>
        <input
          matInput
          id="field_modifiedDate"
          data-cy="modifiedDate"
          type="datetime-local"
          name="modifiedDate"
          formControlName="modifiedDate"
        />
      </mat-form-field>
    </div>

    <div class="flex flex-wrap justify-end gap-3">
      <button
        type="button"
        id="cancel-save"
        data-cy="entityCreateCancelButton"
        mat-button
        class="!rounded-full !px-4"
        (click)="previousState()"
      >
        <mat-icon>close</mat-icon>
        <span hpdTranslate="entity.action.cancel">Cancel</span>
      </button>

      <button
        type="submit"
        id="save-entity"
        data-cy="entityCreateSaveButton"
        [disabled]="editForm.invalid || isSaving"
        mat-flat-button
        class="!rounded-full !bg-slate-900 !px-4 !text-white"
      >
        <mat-icon>save</mat-icon>
        <span hpdTranslate="entity.action.save">Save</span>
      </button>
    </div>
  </form>
</div>
