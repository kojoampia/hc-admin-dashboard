<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (feature(); as featureRef) {
      <div>
        <h2 data-cy="featureDetailsHeading"><span hpdTranslate="adminDashboardApp.hcAdminServiceFeature.detail.title">Feature</span></h2>

        <hr />

        <hpd-alert-error />

        <hpd-alert />

        <dl class="row-md jh-entity-details">
          <dt><span hpdTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ featureRef.id }}</span>
          </dd>
          <dt><span hpdTranslate="adminDashboardApp.hcAdminServiceFeature.name">Name</span></dt>
          <dd>
            <span>{{ featureRef.name }}</span>
          </dd>
          <dt><span hpdTranslate="adminDashboardApp.hcAdminServiceFeature.description">Description</span></dt>
          <dd>
            <span>{{ featureRef.description }}</span>
          </dd>
          <dt><span hpdTranslate="adminDashboardApp.hcAdminServiceFeature.type">Type</span></dt>
          <dd>
            <span [hpdTranslate]="'adminDashboardApp.FeatureType.' + (featureRef.type ?? 'null')">{{
              { null: '', CORE: 'CORE', ADDON: 'ADDON', PREMIUM: 'PREMIUM' }[featureRef.type ?? 'null']
            }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span hpdTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/feature', featureRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span hpdTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
