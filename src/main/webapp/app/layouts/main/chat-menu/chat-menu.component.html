<button mat-icon-button [matMenuTriggerFor]="chatMenu" aria-label="Chat menu">
  @if (unreadCount() > 0) {
    <mat-icon [matBadge]="unreadCount()" matBadgeColor="warn">chat</mat-icon>
  } @else {
    <mat-icon>chat</mat-icon>
  }
</button>
<mat-menu #chatMenu="matMenu">
  <button mat-menu-item>
    <mat-icon>message</mat-icon>
    <span>Messages</span>
  </button>
</mat-menu>
